version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-linkspace}
      POSTGRES_USER: ${POSTGRES_USER:-linkspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkspace}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://linkspace:linkspace@postgres:5432/linkspace}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      - postgres

volumes:
  postgres_data:
